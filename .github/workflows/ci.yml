name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Select Xcode
        run: ./Scripts/select-xcode.sh

      - name: Toolchain
        id: toolchain
        run: |
          set -euo pipefail
          swift --version
          xcodebuild -version
          tag="$(swift --version 2>&1 | shasum -a 256 | cut -c1-12)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Restore SwiftPM build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-macos26-${{ steps.toolchain.outputs.tag }}-${{ hashFiles('Package.resolved', 'Package.swift') }}
          restore-keys: |
            swiftpm-macos26-${{ steps.toolchain.outputs.tag }}-

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Assemble app bundle
        run: make app-debug

      - name: Launch smoke test
        run: make smoke

      - name: Summarize
        if: ${{ always() }}
        run: |
          set -euo pipefail
          source ./Scripts/version-env.sh
          xcode_version="$(xcodebuild -version)"
          xcode_version="${xcode_version%%$'\n'*}"
          {
            printf '### CI\n\n'
            printf '| Field | Value |\n'
            printf '| --- | --- |\n'
            printf '| Version | `%s (%s)` |\n' "$MARKETING_VERSION" "$BUILD_NUMBER"
            printf '| Xcode | `%s` |\n' "$xcode_version"
            printf '| Runner | `%s` |\n' "${RUNNER_NAME:-unknown}"
          } >> "$GITHUB_STEP_SUMMARY"
