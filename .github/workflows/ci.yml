name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repo. On a public repo the pull_request trigger
# runs code from forks, and those runs get no secrets — but pinning this down anyway
# means a compromised dependency cannot write to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Assemble app bundle
        run: make app-debug
