name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Resolve and check version
        id: version
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$TAG" ]; then
            echo "expected a tag like v1.2.3, got '$TAG'" >&2
            exit 1
          fi
          CLI_VERSION=$(grep -oE 'version: "[0-9]+\.[0-9]+\.[0-9]+"' Sources/densha/CLI.swift \
            | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          if [ "$CLI_VERSION" != "$VERSION" ]; then
            echo "tag $TAG means version $VERSION, but Sources/densha/CLI.swift says $CLI_VERSION" >&2
            echo "bump the CLI's version string before tagging." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "asset=Densha-$VERSION-universal.zip" >> "$GITHUB_OUTPUT"

      - name: Import signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          CERT="$RUNNER_TEMP/cert.p12"
          KEYCHAIN="$RUNNER_TEMP/densha-build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -t cert -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          rm -f "$CERT"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build, sign, notarize and staple
        env:
          DENSHA_UNIVERSAL: "1"
          DENSHA_VERSION: ${{ steps.version.outputs.version }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: make notarize

      - name: Verify the asset is notarized and accepted
        run: |
          set -euo pipefail
          make verify-release
          lipo -info dist/Densha.app/Contents/MacOS/Densha
          plutil -extract CFBundleShortVersionString raw dist/Densha.app/Contents/Info.plist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ steps.version.outputs.asset }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mv dist/Densha.zip "dist/$ASSET"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "dist/$ASSET" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "Densha $VERSION" \
              --generate-notes \
              "dist/$ASSET"
          fi

      - name: Remove signing keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN:-}" ]; then
            security delete-keychain "$KEYCHAIN" || true
          fi
