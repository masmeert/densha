name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Select Xcode
        run: |
          set -euo pipefail
          for candidate in /Applications/Xcode_26.4.app \
                           /Applications/Xcode_26.3.app \
                           /Applications/Xcode_26.2.app; do
            if [ -d "$candidate" ]; then
              sudo xcode-select -s "$candidate/Contents/Developer"
              echo "DEVELOPER_DIR=$candidate/Contents/Developer" >> "$GITHUB_ENV"
              break
            fi
          done
          version="$(xcodebuild -version | head -1)"
          case "$version" in
            "Xcode 26."*) ;;
            *) echo "::error::expected Xcode 26.x, runner offers '$version'"; exit 1 ;;
          esac

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Resolve and check version
        id: version
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "$TAG" ]; then
            echo "expected a tag like v1.2.3, got '$TAG'" >&2
            exit 1
          fi
          source ./Scripts/version-env.sh
          if [ "$MARKETING_VERSION" != "$VERSION" ]; then
            echo "tag $TAG means version $VERSION, but version.env says $MARKETING_VERSION" >&2
            echo "cut releases with 'make release VERSION=$VERSION' so both agree." >&2
            exit 1
          fi
          ./Scripts/sync-version.sh --check
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "asset=Densha-$VERSION-universal.zip" >> "$GITHUB_OUTPUT"

      - name: Import signing certificate
        env:
          CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          CERT="$RUNNER_TEMP/cert.p12"
          KEYCHAIN="$RUNNER_TEMP/densha-build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          printf '%s' "$CERT_P12_BASE64" | base64 --decode > "$CERT"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          if ! security import "$CERT" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
              -t cert -f pkcs12 -T /usr/bin/codesign -T /usr/bin/security; then
            OSSL=/usr/bin/openssl
            if ! "$OSSL" pkcs12 -in "$CERT" -nokeys -passin env:CERT_PASSWORD \
                -noout 2>/dev/null; then
              echo "::error::APPLE_CERT_PASSWORD does not match APPLE_CERT_P12_BASE64." \
                "A trailing newline is the usual cause — set it with 'gh secret set" \
                "APPLE_CERT_PASSWORD' and paste at the prompt rather than piping echo."
            elif [ "$("$OSSL" pkcs12 -in "$CERT" -nocerts -nodes \
                -passin env:CERT_PASSWORD 2>/dev/null | grep -c 'PRIVATE KEY')" -eq 0 ]; then
              echo "::error::the .p12 contains no private key. Re-export from Keychain" \
                "Access > login > My Certificates (not the Certificates category)."
            fi
            exit 1
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          rm -f "$CERT"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Check notary credentials
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          set -euo pipefail
          if ! xcrun notarytool history \
              --apple-id "$NOTARY_APPLE_ID" \
              --team-id "$NOTARY_TEAM_ID" \
              --password "$NOTARY_PASSWORD" > /dev/null 2>&1; then
            echo "::error::Apple rejected the notary credentials. Check NOTARY_APPLE_ID," \
              "NOTARY_TEAM_ID and NOTARY_PASSWORD. The password must be an" \
              "app-specific password from appleid.apple.com, not your Apple ID" \
              "password, and must not have a trailing newline."
            exit 1
          fi
          echo "notary credentials accepted"

      - name: Build, sign, notarize and staple
        env:
          DENSHA_UNIVERSAL: "1"
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: make notarize

      - name: Verify the asset is notarized and accepted
        run: |
          set -euo pipefail
          make verify-release
          lipo -info dist/Densha.app/Contents/MacOS/Densha
          shipped_version=$(plutil -extract CFBundleShortVersionString raw dist/Densha.app/Contents/Info.plist)
          shipped_build=$(plutil -extract CFBundleVersion raw dist/Densha.app/Contents/Info.plist)
          echo "bundle reports $shipped_version ($shipped_build)"
          [ "$shipped_version" = "${{ steps.version.outputs.version }}" ] \
            || { echo "bundle version does not match the tag" >&2; exit 1; }
          [ "$shipped_build" = "${{ steps.version.outputs.build }}" ] \
            || { echo "bundle build number does not match version.env" >&2; exit 1; }
          cli_version=$(dist/Densha.app/Contents/Helpers/densha --version)
          [ "$cli_version" = "${{ steps.version.outputs.version }}" ] \
            || { echo "densha --version reports $cli_version, expected the tag" >&2; exit 1; }

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ steps.version.outputs.asset }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mv dist/Densha.zip "dist/$ASSET"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "dist/$ASSET" --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "Densha $VERSION" \
              --generate-notes \
              "dist/$ASSET"
          fi

      - name: Remove signing keychain
        if: always()
        run: |
          if [ -n "${KEYCHAIN:-}" ]; then
            security delete-keychain "$KEYCHAIN" || true
          fi
